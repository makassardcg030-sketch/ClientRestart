name: Build Executable (Windows 7 & Windows 10, 32-bit & 64-bit)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    # windows-2022 = Server 2022. JANGAN windows-latest (Server 2025) —
    # toolchain-nya lebih baru dan berisiko menghasilkan biner yg
    # menolak jalan di Windows 7.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Windows 7 32-bit ---
          - arch: x86
            name_suffix: win7_32bit
            # Python 3.8.10 32-bit: versi terakhir yg resmi support Win7 32-bit
          # --- Windows 7 64-bit / Windows 10 64-bit ---
          # 1 build 64-bit ini jalan di Win7 x64 DAN Win10 x64,
          # karena Python 3.8 tidak memakai API yg hanya ada di Win10.
          - arch: x64
            name_suffix: win64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.8.10 (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --force-reinstall "lief==0.14.1"
          pip show lief cx-Freeze

      - name: Build with cx_Freeze
        env:
          BUILD_SUFFIX: ${{ matrix.name_suffix }}
        run: |
          python build.py build_exe --build-exe "dist/build_${{ matrix.name_suffix }}"

      - name: Verify output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse dist | Select-Object FullName, Length
          if (-not (Test-Path "dist/build_${{ matrix.name_suffix }}/clientDCP_${{ matrix.name_suffix }}.exe")) { throw "clientDCP exe hilang!" }
          if (-not (Test-Path "dist/build_${{ matrix.name_suffix }}/clients_${{ matrix.name_suffix }}.exe")) { throw "clients exe hilang!" }

      - name: Zip hasil build (biar gampang dibagikan)
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/build_${{ matrix.name_suffix }}/*" -DestinationPath "dist/ClientDCP-${{ matrix.name_suffix }}.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.name_suffix }}
          path: |
            dist/build_${{ matrix.name_suffix }}/
            dist/ClientDCP-${{ matrix.name_suffix }}.zip
