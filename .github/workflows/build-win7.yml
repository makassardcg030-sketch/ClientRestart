name: Build Executable (Windows 7 32-bit & 64-bit)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x86
            name_suffix: win7_32bit
          - arch: x64
            name_suffix: win64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.8.10 (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build clientDCPx86.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "clientDCP_${{ matrix.name_suffix }}" clientDCPx86.py

      - name: Build clientsx86.exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "clients_${{ matrix.name_suffix }}" clientsx86.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.name_suffix }}
          path: dist/*.exe
